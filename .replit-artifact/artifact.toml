kind = "mobile"
previewPath = "/"
title = "Bhoomi - Smart Irrigation"
version = "1.0.0"
id = "artifacts/bhoomi"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21484

[services.development]
run = "pnpm --filter @workspace/bhoomi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhoomi", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bhoomi", "run", "serve" ]

[services.env]
PORT = "21484"
BASE_PATH = "/"
